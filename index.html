<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>最寄り駅アンケート</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #667085;
    --accent: #1f6feb; --accent-weak: #e8f0fe; --border: #d9dee7; --ok: #1a7f37; --err: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b1f27; --text: #e6e9ef; --muted: #9aa4b2;
      --accent: #5b9bff; --accent-weak: #1e2a40; --border: #2e3440; --ok: #4cc26a; --err: #ff6b6b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height: 1.6; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.35rem; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 20px; font-size: .95rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  .opt { font-weight: 400; color: var(--muted); font-size: .85rem; }
  input[type=text] { width: 100%; font-size: 1rem; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; }
  button { font: inherit; font-size: 1rem; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff; cursor: pointer; white-space: nowrap; }
  button.sub { background: transparent; color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .results { margin-top: 12px; display: grid; gap: 8px; }
  .st { text-align: left; background: var(--bg); color: var(--text); border: 1px solid var(--border); width: 100%; white-space: normal; }
  .st.sel { border-color: var(--accent); background: var(--accent-weak); }
  .st b { font-size: 1.05rem; }
  .st small { display: block; color: var(--muted); font-size: .8rem; }
  .msg { margin-top: 10px; font-size: .9rem; color: var(--muted); }
  .msg.err { color: var(--err); }
  .done { text-align: center; }
  .done .big { font-size: 1.6rem; font-weight: 700; margin: 8px 0; }
  .done .ok { color: var(--ok); font-weight: 700; }
  .hidden { display: none; }
  .note { font-size: .8rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1 id="title">最寄り駅アンケート</h1>
  <p class="lead">行事の開催場所を、みなさんの最寄り駅の「真ん中」から決めます。普段使う最寄り駅を1つ入力してください。回答は1台の端末につき1回です。</p>

  <div id="setupWarn" class="card hidden">
    <b>まだ受付の準備中です。</b><br>
    <span class="note">（管理者の方へ：config.js に GAS_URL が設定されていません）</span>
  </div>

  <div id="formArea">
    <div class="card">
      <label for="name">お名前 <span class="opt">（任意・ニックネーム可）</span></label>
      <input type="text" id="name" maxlength="40" autocomplete="name">
    </div>

    <div class="card">
      <label for="q">最寄り駅</label>
      <div class="row">
        <input type="text" id="q" placeholder="例：吉祥寺" enterkeyhint="search">
        <button id="searchBtn">検索</button>
      </div>
      <div style="margin-top:8px">
        <button class="sub" id="geoBtn">現在地の近くの駅から選ぶ</button>
      </div>
      <div id="searchMsg" class="msg"></div>
      <div id="results" class="results"></div>
    </div>

    <div class="card">
      <div id="selected" class="msg">駅を検索して、一覧から選んでください。</div>
      <button id="submitBtn" style="width:100%;margin-top:10px" disabled>この駅で回答する</button>
      <div id="submitMsg" class="msg"></div>
    </div>
  </div>

  <div id="doneArea" class="card done hidden">
    <div class="ok">回答ありがとうございました</div>
    <div class="big" id="doneStation"></div>
    <div class="note">この端末からは回答済みです。変更したい場合は幹事に連絡してください。</div>
  </div>
</main>

<script src="config.js"></script>
<script src="common.js"></script>
<script>
(function () {
  const cfg = window.CS_CONFIG || {};
  const $ = (id) => document.getElementById(id);
  if (cfg.EVENT_TITLE) { $("title").textContent = cfg.EVENT_TITLE; document.title = cfg.EVENT_TITLE; }

  const DONE_KEY = "cs_submitted";
  const DEV_KEY = "cs_device_id";

  function deviceId() {
    let id = CS.storageGet(DEV_KEY);
    if (!id) {
      id = (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2)));
      CS.storageSet(DEV_KEY, id);
    }
    return id;
  }

  function showDone(station) {
    $("formArea").classList.add("hidden");
    $("doneArea").classList.remove("hidden");
    $("doneStation").textContent = /^（/.test(station) ? station : station + "駅";
  }

  const prev = CS.storageGet(DONE_KEY);
  if (prev) {
    try { showDone(JSON.parse(prev).name); } catch (e) { showDone(prev); }
    return;
  }
  if (!cfg.GAS_URL) {
    $("setupWarn").classList.remove("hidden");
  }

  let chosen = null;

  function renderResults(groups, emptyText) {
    const box = $("results");
    box.innerHTML = "";
    if (!groups.length) { $("searchMsg").textContent = emptyText; return; }
    $("searchMsg").textContent = groups.length > 1 ? "同じ名前の駅が複数あります。都道府県・路線を確認して選んでください。" : "";
    groups.forEach((g) => {
      const b = document.createElement("button");
      b.className = "st";
      b.innerHTML = "<b>" + CS.escapeHtml(g.name) + "駅</b><small>" +
        CS.escapeHtml(g.prefecture) + "　" + CS.escapeHtml(g.lines.join("・")) + "</small>";
      b.onclick = () => {
        chosen = g;
        [...box.children].forEach((c) => c.classList.remove("sel"));
        b.classList.add("sel");
        $("selected").innerHTML = "選んだ駅：<b>" + CS.escapeHtml(g.name) + "駅</b>（" + CS.escapeHtml(g.prefecture) + "）";
        $("submitBtn").disabled = !cfg.GAS_URL;
      };
      box.appendChild(b);
    });
    if (groups.length === 1) box.firstChild.click();
  }

  async function doSearch() {
    const q = $("q").value;
    if (!CS.normalizeStationName(q)) return;
    $("searchMsg").classList.remove("err");
    $("searchMsg").textContent = "検索中…";
    $("results").innerHTML = "";
    try {
      const groups = await CS.searchStations(q);
      renderResults(groups, "見つかりませんでした。駅名を正しい漢字で入力してください（「駅」は付けなくて大丈夫です）。");
    } catch (e) {
      $("searchMsg").classList.add("err");
      $("searchMsg").textContent = "検索できませんでした。通信環境を確認してもう一度お試しください。";
    }
  }

  $("searchBtn").onclick = doSearch;
  $("q").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) doSearch(); });

  $("geoBtn").onclick = () => {
    if (!navigator.geolocation) { $("searchMsg").textContent = "この端末では現在地を使えません。"; return; }
    $("searchMsg").textContent = "現在地を確認中…";
    navigator.geolocation.getCurrentPosition(async (pos) => {
      try {
        const groups = await CS.nearestStations(pos.coords.latitude, pos.coords.longitude);
        renderResults(groups, "近くの駅が見つかりませんでした。");
      } catch (e) {
        $("searchMsg").textContent = "検索できませんでした。";
      }
    }, () => { $("searchMsg").textContent = "現在地を取得できませんでした。駅名で検索してください。"; },
    { timeout: 15000 });
  };

  $("submitBtn").onclick = async () => {
    if (!chosen || !cfg.GAS_URL) return;
    if (!confirm(chosen.name + "駅 で回答します。回答は1回だけです。よろしいですか？")) return;
    $("submitBtn").disabled = true;
    $("submitMsg").classList.remove("err");
    $("submitMsg").textContent = "送信中…";
    try {
      const r = await CS.jsonp(cfg.GAS_URL, {
        action: "submit",
        deviceId: deviceId(),
        name: $("name").value.trim(),
        station: chosen.name,
        line: chosen.lines.join("・"),
        prefecture: chosen.prefecture,
        lat: chosen.lat,
        lng: chosen.lng
      }, 30000);
      if (r && (r.ok || r.duplicate)) {
        const shown = r.ok ? chosen.name : "（以前の回答）";
        CS.storageSet(DONE_KEY, JSON.stringify({ name: shown, at: Date.now() }));
        showDone(shown);
      } else {
        throw new Error((r && r.error) || "送信に失敗しました");
      }
    } catch (e) {
      $("submitMsg").classList.add("err");
      $("submitMsg").textContent = "送信できませんでした：" + e.message;
      $("submitBtn").disabled = false;
    }
  };
})();
</script>
</body>
</html>
